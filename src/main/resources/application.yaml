spring:
  application:
    name: babysense_server
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    # 보안 옵션(allowPublicKeyRetrieval=true)이 추가되었습니다.
    url: jdbc:mysql://localhost:3306/babysense_db?useSSL=false&characterEncoding=UTF-8&serverTimezone=Asia/Seoul&allowPublicKeyRetrieval=true
    username: root
    password: 1234
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        # ★ MySQL 방언을 명시적으로 추가하여 에러를 방지합니다.
        dialect: org.hibernate.dialect.MySQLDialect